<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed</title>
</head>
<body>

    <h1>🎉 Thank You For Your Order!</h1>

    <p>Your pizza is now being prepared.</p>

    <h2>Order Number: <span id="orderNumber"></span></h2>

    <div id="orderDetails"></div>

    <a href="index.html">
        <button>Return Home</button>
    </a>

    <script>
        const orderNumber = localStorage.getItem("orderNumber");
        const orderData = JSON.parse(localStorage.getItem("lastOrder")) || [];

        if (orderNumber) {
            document.getElementById("orderNumber").textContent = orderNumber;
        }

        let html = "";

        orderData.forEach((item, index) => {
            html += `
                <h3>Pizza ${index + 1}</h3>

                <p><strong>Name:</strong> ${item.customerName}</p>

                <p><strong>Phone:</strong> ${item.phone}</p>

                <p><strong>Crust:</strong> ${item.pizzaType}</p>

                <p><strong>Size:</strong> ${item.size}</p>

                <p><strong>Toppings:</strong> ${item.toppings.join(", ")}</p>

                <p><strong>Instructions:</strong> ${item.instructions}</p>

                <p><strong>Total:</strong> $${item.total}</p>

                <hr>
            `;
        });

        document.getElementById("orderDetails").innerHTML = html;
    </script>

</body>
</html>
